<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile | Karachi Mart</title><link rel="stylesheet" href="style.css"></head><body class="plain-page"><header class="site-header"><a class="brand" href="index.html"><strong>Karachi <span>Mart</span></strong></a><a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to shop</a></header><main class="content narrow"><p class="eyebrow">Your account</p><h1>My profile</h1><section class="profile-card"><div class="profile-top"><button id="profile-avatar" class="profile-avatar" type="button">KM</button><div><h2 id="profile-name">Customer</h2><p id="profile-email">customer@example.com</p></div></div><div class="photo-actions"><label for="profile-photo" class="secondary-button"><i class="fa-solid fa-camera"></i> Change photo</label><input id="profile-photo" type="file" accept="image/jpeg,image/png,image/webp"><button id="remove-photo" class="text-button" type="button">Remove photo</button><small id="photo-message">JPG, PNG or WebP up to 5 MB</small></div><div class="profile-stats"><div><span>Total orders</span><strong id="total-orders">0</strong></div><div><span>Total purchases</span><strong id="total-purchases">Rs. 0</strong></div></div><h2>Purchase history</h2><div id="order-history" class="order-history"></div><button id="profile-logout" class="logout-button" type="button">Logout</button></section></main><div id="photo-modal" class="photo-modal" hidden><button id="close-photo" class="icon-button" type="button"><i class="fa-solid fa-xmark"></i></button><img id="photo-preview" alt="Profile photo"></div><script src="profile.js"></script></body></html>
