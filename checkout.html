<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | Karachi Mart</title><link rel="stylesheet" href="style.css"></head><body class="plain-page"><header class="site-header"><a class="brand" href="index.html"><strong>Karachi <span>Mart</span></strong></a><a class="back-link" href="cart.html"><i class="fa-solid fa-arrow-left"></i> Back to cart</a></header><main class="content narrow"><p class="eyebrow">Secure checkout</p><h1>Delivery details</h1><form id="checkout-form" class="checkout-form"><label>Full name<input id="customer-name" autocomplete="name" required></label><label>Phone<input id="customer-phone" type="tel" autocomplete="tel" required></label><label>Area<select id="customer-area" required><option value="">Select area</option><option>Gulistan-e-Johar</option><option>Gulshan-e-Iqbal</option><option>Malir</option><option>North Nazimabad</option><option>DHA Karachi</option></select></label><label>Complete address<textarea id="customer-address" autocomplete="street-address" required></textarea></label><label class="check-label"><input id="save-address" type="checkbox"> Save address for next order</label><fieldset><legend>Payment method</legend><label class="radio-label"><input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery</label><label class="radio-label"><input type="radio" name="payment" value="EasyPaisa"> EasyPaisa</label><label class="radio-label"><input type="radio" name="payment" value="JazzCash"> JazzCash</label><p class="payment-note">EasyPaisa/JazzCash: 0349-5809136</p></fieldset><button class="primary-button" type="submit">Place order</button><p id="checkout-message" class="form-message"></p></form></main><script src="app.js"></script><script src="checkout.js"></script></body></html>
