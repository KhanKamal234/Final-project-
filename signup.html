<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign up | Karachi Mart</title><link rel="stylesheet" href="login.css"></head><body><main class="auth-page"><section class="auth-card"><a class="auth-brand" href="index.html">Karachi <span>Mart</span></a><p class="eyebrow">Join Karachi Mart</p><h1>Create your account</h1><form id="signup-form"><label>Full name<input id="signup-name" type="text" autocomplete="name" required></label><label>Email address<input id="signup-email" type="email" autocomplete="email" required></label><label>Password<input id="signup-password" type="password" autocomplete="new-password" minlength="6" required></label><label>Confirm password<input id="signup-confirm" type="password" autocomplete="new-password" minlength="6" required></label><button class="auth-button" type="submit">Create account</button><p id="signup-message" class="form-message"></p></form><p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p></section></main><script src="auth.js"></script></body></html>
